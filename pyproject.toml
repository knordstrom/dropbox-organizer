[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "dropbox-organizer"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "dropbox>=12.0.0",
    "anthropic>=0.40.0",
    "click>=8.1",
    "python-dotenv>=1.0",
    "rich>=13.0",
    "Pillow>=10.0",
]

[project.scripts]
dropbox-organizer = "dropbox_organizer.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
